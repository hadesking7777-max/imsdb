<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScriptBot · 剧本助手</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #e3e1dc;
    --accent: #8a3b12; --accent-soft: #f3e6dd; --user: #23395b; --user-ink: #ffffff; --warn: #9a6700;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161618; --panel: #1f1f22; --ink: #ececee; --muted: #9a9aa2; --line: #2e2e33;
      --accent: #e39a6a; --accent-soft: #3a2a20; --user: #2f4a73; --user-ink: #f2f4f8; --warn: #e3b341;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.6 system-ui, "Segoe UI", "Microsoft YaHei",
         "PingFang SC", sans-serif; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line);
           background: var(--panel); }
  header h1 { font-size: 17px; margin: 0; font-weight: 650; }
  header h1 span { color: var(--muted); font-weight: 400; margin-left: 6px; }
  .spacer { flex: 1; }
  .pill { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
  .pill.ready { color: #2e7d32; border-color: #2e7d3255; }
  .pill.error { color: #c62828; border-color: #c6282855; }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--panel);
           color: var(--ink); padding: 6px 12px; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  main { flex: 1; overflow-y: auto; }
  #log { max-width: 820px; margin: 0 auto; padding: 20px 16px 8px; }
  .welcome { color: var(--muted); padding: 24px 4px; }
  .welcome h2 { color: var(--ink); font-size: 20px; margin: 0 0 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .chip { font-size: 13.5px; background: var(--accent-soft); border: 1px solid transparent; color: var(--ink);
          border-radius: 999px; padding: 6px 12px; }
  .msg { margin: 14px 0; display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble { max-width: 92%; padding: 10px 14px; border-radius: 14px; word-wrap: break-word; overflow-wrap: anywhere; }
  .user .bubble { background: var(--user); color: var(--user-ink); border-bottom-right-radius: 4px; white-space: pre-wrap; }
  .bot .bubble { background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 4px; width: 100%; }
  .status { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
  .answer p { margin: 0 0 8px; } .answer p:last-child { margin-bottom: 0; }
  .answer ul { margin: 4px 0 8px; padding-left: 22px; }
  .cite { color: var(--accent); cursor: pointer; font-size: 12px; vertical-align: super; text-decoration: none;
          font-weight: 600; padding: 0 1px; }
  .sources { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 8px; font-size: 13px; }
  .sources summary { cursor: pointer; color: var(--muted); }
  .src { margin: 6px 0; }
  .src b { color: var(--accent); margin-right: 4px; }
  .src button { font-size: 12px; padding: 1px 8px; margin-left: 6px; }
  .src pre { white-space: pre-wrap; font: 12.5px/1.5 var(--mono); background: var(--bg); border: 1px solid var(--line);
             border-radius: 8px; padding: 8px 10px; margin: 6px 0 0; max-height: 320px; overflow: auto; }
  .src.flash pre, .src.flash { animation: flash 1.2s; }
  @keyframes flash { from { background: var(--accent-soft) } to { background: transparent } }
  .meta { font-size: 11.5px; color: var(--muted); margin-top: 6px; }
  .err { color: #c62828; }
  .warn { color: var(--warn); font-size: 13px; margin-top: 8px; border-left: 3px solid var(--warn); padding-left: 8px; }
  footer { border-top: 1px solid var(--line); background: var(--panel); }
  form { max-width: 820px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 8px; align-items: flex-end; }
  textarea { flex: 1; resize: none; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
             border-radius: 10px; padding: 9px 12px; min-height: 42px; max-height: 160px; }
  textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  #send { background: var(--accent); color: #fff; border-color: var(--accent); min-width: 72px; height: 42px; }
  .notice { max-width: 820px; margin: 0 auto; padding: 0 16px 8px; font-size: 11.5px; color: var(--muted); }
  @media (max-width: 560px) { header h1 span { display: none; } .bubble { max-width: 100%; } }
</style>
</head>
<body>
<header>
  <h1>ScriptBot<span data-i18n="subtitle"></span></h1>
  <div class="spacer"></div>
  <span id="state" class="pill"></span>
  <button id="lang" type="button" title="Language / 语言"></button>
  <button id="reset" type="button" data-i18n="newChat"></button>
</header>
<main id="main"><div id="log"></div></main>
<footer>
  <form id="form">
    <textarea id="q" rows="1" maxlength="2000"></textarea>
    <button id="send" type="submit"></button>
  </form>
  <div class="notice" data-i18n="notice"></div>
</footer>
<script>
"use strict";
const T = {
  en: {
    subtitle: "· offline screenplay assistant", newChat: "New chat", send: "Send", stop: "Stop",
    placeholder: "Ask about a film, a character, a scene or a quote… (English or 中文)",
    notice: "Runs entirely on this computer. Screenplays: IMSDb (imsdb.com); all rights belong to their studios and writers. Drafts may differ from the released films.",
    welcomeTitle: "Ask about ~1,200 film screenplays", welcome: "Answers are written from the stored screenplays and cite the scenes they use. On this computer an answer takes about 1–2 minutes; it appears as it is written.",
    loading: s => `Loading local models… ${s}s`, ready: n => `Ready · ${n} films`, error: "Model error",
    stages: { queued: "Waiting for the previous question…", loading: "Loading models…", planning: "Understanding the question…", searching: "Searching the screenplays…", writing: "Writing the answer…" },
    sources: n => `Sources (${n})`, show: "Show passage", hide: "Hide", scene: "scene", stopped: "Stopped.",
    seconds: s => `${s}s`, took: (t) => `answered in ${t}s`,
    unverified: "⚠ Not found word-for-word in the cited passages, may be inaccurate:",
    examples: ["Who wrote Alien, and who are its main characters?", "How does The Shawshank Redemption end?", "What does Jules say before he shoots in Pulp Fiction?", "List all horror films", "《教父》里迈克尔第一次出场说了什么？", "《泰坦尼克号》的结局是怎样的？"],
  },
  zh: {
    subtitle: "· 离线剧本助手", newChat: "新对话", send: "发送", stop: "停止",
    placeholder: "询问电影、角色、场景或台词……（中文或 English）",
    notice: "完全在本机运行。剧本来源：IMSDb（imsdb.com），版权归各制片公司和编剧所有。剧本草稿可能与上映版本不同。",
    welcomeTitle: "询问约 1,200 部电影剧本", welcome: "回答基于本地存储的剧本，并标注所引用的场景。在这台电脑上，每个回答大约需要 1–2 分钟，文字会边生成边显示。",
    loading: s => `正在加载本地模型…… ${s} 秒`, ready: n => `就绪 · ${n} 部电影`, error: "模型错误",
    stages: { queued: "正在等待上一个问题完成……", loading: "正在加载模型……", planning: "正在理解问题……", searching: "正在检索剧本……", writing: "正在撰写回答……" },
    sources: n => `引用来源（${n}）`, show: "查看片段", hide: "收起", scene: "场景", stopped: "已停止。",
    seconds: s => `${s} 秒`, took: (t) => `用时 ${t} 秒`,
    unverified: "⚠ 以下引文在所引片段中找不到原文，可能不准确：",
    examples: ["《异形》的编剧是谁？主要角色有哪些？", "《肖申克的救赎》结局是怎样的？", "《低俗小说》里朱尔斯开枪前说了什么？", "列出所有恐怖片", "In The Godfather, what does Michael say when he first appears?", "How does Titanic end?"],
  },
};
let lang = localStorageGet("lang");
if (lang !== "en" && lang !== "zh") lang = (navigator.language || "en").toLowerCase().startsWith("zh") ? "zh" : "en";
let sessionId = null, controller = null, health = null;
const $ = id => document.getElementById(id);
const log = $("log"), main = $("main"), q = $("q"), send = $("send");

function localStorageGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function localStorageSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function t(key, ...a) { const v = T[lang][key]; return typeof v === "function" ? v(...a) : v; }

function applyLang() {
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  $("lang").textContent = lang === "zh" ? "English" : "中文";
  q.placeholder = t("placeholder");
  send.textContent = controller ? t("stop") : t("send");
  renderHealth();
  if (!log.querySelector(".msg")) welcome();
}
function welcome() {
  log.innerHTML = "";
  const w = el("div", "welcome");
  w.append(el("h2", "", t("welcomeTitle")), el("div", "", t("welcome")));
  const chips = el("div", "chips");
  for (const ex of t("examples")) {
    const c = el("button", "chip", ex); c.type = "button";
    c.onclick = () => { q.value = ex; ask(); };
    chips.append(c);
  }
  w.append(chips); log.append(w);
}
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function renderMarkdown(text, msgId) {
  const blocks = escapeHtml(text.trim()).split(/\n{2,}/);
  return blocks.map(b => {
    const lines = b.split("\n");
    const inline = s => s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
                         .replace(/(^|[^*])\*([^*\n]+?)\*(?!\*)/g, "$1<em>$2</em>")
                         .replace(/\[(\d{1,2})\]/g, `<a class="cite" data-msg="${msgId}" data-n="$1">[$1]</a>`);
    if (lines.every(l => /^\s*([-*•]|\d+[.)])\s+/.test(l))) {
      return "<ul>" + lines.map(l => "<li>" + inline(l.replace(/^\s*([-*•]|\d+[.)])\s+/, "")) + "</li>").join("") + "</ul>";
    }
    return "<p>" + lines.map(inline).join("<br>") + "</p>";
  }).join("");
}
function scrollDown() { main.scrollTop = main.scrollHeight; }

async function ask() {
  const question = q.value.trim();
  if (!question || controller) return;
  if (log.querySelector(".welcome")) log.innerHTML = "";
  q.value = ""; autosize();
  const u = el("div", "msg user"); u.append(el("div", "bubble", question)); log.append(u);
  const msgId = "m" + Date.now();
  const m = el("div", "msg bot"); const b = el("div", "bubble"); b.id = msgId; m.append(b); log.append(m);
  const status = el("div", "status"); status.append(el("span", "dot"), el("span", "", t("stages").planning));
  const answer = el("div", "answer"); const sources = el("div"); const meta = el("div", "meta");
  b.append(status, answer, sources, meta); scrollDown();
  let text = "", stage = "planning", started = Date.now();
  const tick = setInterval(() => {
    status.lastChild.textContent = `${t("stages")[stage] || ""} ${t("seconds", Math.round((Date.now() - started) / 1000))}`;
  }, 1000);
  controller = new AbortController(); send.textContent = t("stop");
  try {
    const resp = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, session_id: sessionId }), signal: controller.signal });
    if (!resp.ok) throw new Error((await resp.json()).error || resp.statusText);
    const reader = resp.body.getReader(); const dec = new TextDecoder(); let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const raw = buf.slice(0, i); buf = buf.slice(i + 2);
        const ev = (raw.match(/^event: (.+)$/m) || [])[1], data = JSON.parse((raw.match(/^data: (.+)$/m) || [, "{}"])[1]);
        if (ev === "session") sessionId = data.session_id;
        else if (ev === "status") { stage = data.stage; status.lastChild.textContent = t("stages")[stage] || stage; }
        else if (ev === "token") { if (!text) status.style.display = "none"; text += data.text; answer.innerHTML = renderMarkdown(text, msgId); scrollDown(); }
        else if (ev === "sources") renderSources(sources, data.sources, msgId);
        else if (ev === "done") {
          answer.innerHTML = renderMarkdown(data.answer || text, msgId);
          if (data.timings && data.timings.total) meta.textContent = t("took", data.timings.total);
          if (data.unverified_quotes && data.unverified_quotes.length) {
            const w = el("div", "warn", t("unverified") + " " + data.unverified_quotes.map(x => `"${x}"`).join(", "));
            answer.append(w);
          }
        }
        else if (ev === "error") { status.style.display = "none"; answer.append(el("div", "err", data.message)); }
      }
    }
  } catch (e) {
    status.style.display = "none";
    if (e.name === "AbortError") answer.append(el("div", "meta", t("stopped")));
    else answer.append(el("div", "err", String(e.message || e)));
  } finally {
    clearInterval(tick); controller = null; send.textContent = t("send"); scrollDown(); q.focus();
  }
}

function renderSources(container, list, msgId) {
  container.innerHTML = "";
  if (!list || !list.length) return;
  const d = el("details", "sources"); d.append(el("summary", "", t("sources", list.length)));
  for (const s of list) {
    const row = el("div", "src"); row.id = `${msgId}-src-${s.n}`;
    row.append(el("b", "", `[${s.n}]`), document.createTextNode(s.label));
    const btn = el("button", "", t("show")); btn.type = "button";
    btn.onclick = async () => {
      const pre = row.querySelector("pre");
      if (pre) { pre.remove(); btn.textContent = t("show"); return; }
      btn.disabled = true;
      try {
        const r = await fetch("/api/passage?id=" + encodeURIComponent(s.chunk_id));
        const doc = await r.json(); row.append(el("pre", "", doc.text || s.excerpt));
      } catch (e) { row.append(el("pre", "", s.excerpt)); }
      btn.disabled = false; btn.textContent = t("hide");
    };
    row.append(btn); d.append(row);
  }
  container.append(d);
}

log.addEventListener("click", e => {
  const c = e.target.closest(".cite"); if (!c) return;
  const row = document.getElementById(`${c.dataset.msg}-src-${c.dataset.n}`); if (!row) return;
  row.closest("details").open = true; row.scrollIntoView({ behavior: "smooth", block: "center" });
  row.classList.remove("flash"); void row.offsetWidth; row.classList.add("flash");
});

function renderHealth() {
  const s = $("state");
  if (!health) { s.textContent = "…"; s.className = "pill"; return; }
  if (health.state === "ready") {
    const dev = (health.models && health.models.device) || {};
    s.textContent = t("ready", health.films) + (dev.device === "gpu" ? " · GPU" : " · CPU");
    s.title = dev.label ? dev.label + (dev.reason ? " — " + dev.reason : "") : "";
    s.className = "pill ready";
  }
  else if (health.state === "error") { s.textContent = t("error"); s.title = health.error; s.className = "pill error"; }
  else { s.textContent = t("loading", health.seconds || 0); s.className = "pill"; }
}
async function pollHealth() {
  try { health = await (await fetch("/api/health")).json(); } catch (e) { health = { state: "error", error: "server not reachable" }; }
  renderHealth();
  if (health.state === "loading") setTimeout(pollHealth, 1000);
}

function autosize() { q.style.height = "auto"; q.style.height = Math.min(q.scrollHeight, 160) + "px"; }
q.addEventListener("input", autosize);
q.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(); } });
$("form").addEventListener("submit", e => { e.preventDefault(); if (controller) controller.abort(); else ask(); });
$("lang").onclick = () => { lang = lang === "zh" ? "en" : "zh"; localStorageSet("lang", lang); applyLang(); };
$("reset").onclick = async () => {
  if (controller) controller.abort();
  if (sessionId) { try { await fetch("/api/reset", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ session_id: sessionId }) }); } catch (e) {} }
  sessionId = null; welcome(); q.focus();
};
applyLang(); pollHealth(); q.focus();
</script>
</body>
</html>
